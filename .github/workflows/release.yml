name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Preparar la key de firma
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/woba-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/woba-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No hay KEYSTORE_BASE64: se compila el APK sin firmar."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: WobaSLauncher-release-apk
          path: dist/*.apk

      - name: Publicar en Releases (solo con tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
